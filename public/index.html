<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
</head>
<body>
  <h1>BMI Calculator</h1>
 <p>Made by: Mae Angela Faylon and Ashly Jana Quising</p>

  <label>Weight (kg): <input id="weight" type="number"></label><br>
  <label>Height (cm): <input id="height" type="number"></label><br>
  <button id="calculate">Calculate</button>

  <p id="result"></p>
  <footer>Version <span id="version"></span></footer>

  <script>
    document.getElementById('calculate').addEventListener('click', async () => {
      const response = await fetch('/api/calculate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          weight: document.getElementById('weight').value,
          height: document.getElementById('height').value
        })
      });
      const data = await response.json();
      if (response.ok) {
        document.getElementById('result').textContent =
          'Your BMI: ' + data.bmi + ' | Category: ' + data.category;
      } else {
        document.getElementById('result').textContent = 'Error: ' + data.error;
      }
    });

    fetch('/health')
      .then((response) => response.json())
      .then((data) => {
        document.getElementById('version').textContent = data.version;
      });
  </script>
</body>
</html>
